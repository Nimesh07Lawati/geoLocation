name: location_app
description: "A real-time location tracker using OpenStreetMap - 100% free."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Location
  geolocator: ^14.0.2

  # State management
  provider: ^6.1.5+1

  # HTTP
  http: ^1.5.0

  # FREE Map - No API key needed!
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true